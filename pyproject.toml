[project]
name = "mugello06"
version = "0.1.0"
description = "Data pipeline behind a static poster of the 2006 MotoGP Italian GP at Mugello (Rossi vs Capirossi)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pdfplumber>=0.11",
    "polars>=1.0",
    "pyarrow>=17",
    "tableauhyperapi>=0.0.20000",
]

[project.scripts]
mugello06 = "mugello06.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mugello06"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs real raw data in data/raw (skipped in CI if absent)",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
